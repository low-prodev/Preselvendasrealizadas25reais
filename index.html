<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Compra confirmada</title>
  <meta name="robots" content="noindex, nofollow">

  <!--
    PÁGINA DE CONFIRMAÇÃO / ENTREGA
    O evento Purchase abaixo dispara quando esta página carrega. Isso só é
    legítimo se esta URL for exibida EXCLUSIVAMENTE após um pagamento real
    confirmado (redirecionamento pós-pagamento do checkout/gateway).
    Esta página não verifica pagamento por conta própria: essa proteção
    precisa existir no fluxo de checkout. Não divulgue esta URL
    em anúncios, redes sociais ou na página de vendas.
  -->

  <!-- Meta Pixel Code -->
  <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');

    fbq('init', '1787284662173454');

    // eventID único, útil para deduplicação com uma futura Conversions API.
    var eventId = 'purchase_' + (window.crypto && crypto.randomUUID
      ? crypto.randomUUID()
      : Date.now() + '_' + Math.random().toString(36).slice(2));

    // Único disparo de Purchase na página.
    fbq('track', 'Purchase', {
      value: 25.00,
      currency: 'BRL'
    }, {
      eventID: eventId
    });
  </script>
  <noscript>
    <img height="1" width="1" style="display:none" alt=""
         src="https://www.facebook.com/tr?id=1787284662173454&ev=Purchase&cd[value]=25.00&cd[currency]=BRL&noscript=1">
  </noscript>
  <!-- End Meta Pixel Code -->

  <style>
    :root {
      --bg: #12000d;
      --text: #fff;
      --muted: #ddd;
      --accent: #ff1abf;
      --accent-2: #ff4fd8;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; min-height: 100%; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
      background: radial-gradient(circle at center, #4d0037 0%, #1a0014 50%, #000 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: min(650px, 140vw);
      height: min(650px, 140vw);
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(255, 26, 191, 0.25) 0%, transparent 75%);
      filter: blur(80px);
      animation: glow 6s ease-in-out infinite alternate;
      pointer-events: none;
    }

    main {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      animation: enter 0.8s ease-out both;
    }

    h1 {
      margin: 0;
      font-size: clamp(22px, 6vw, 28px);
      font-weight: 600;
      line-height: 1.25;
      text-shadow: 0 0 18px rgba(255, 26, 191, 0.7);
    }

    p {
      margin: 0;
      max-width: 34ch;
      font-size: 17px;
      line-height: 1.5;
      color: var(--muted);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 56px;
      margin-top: 10px;
      padding: 16px 32px;
      border-radius: 12px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-decoration: none;
      box-shadow: 0 0 25px rgba(255, 26, 191, 0.5);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:hover { transform: translateY(-2px); box-shadow: 0 0 45px rgba(255, 26, 191, 0.85); }
    .btn:active { transform: scale(0.98); }
    .btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

    @keyframes glow {
      from { opacity: 0.3; transform: translate(-50%, -50%) scale(1); }
      to   { opacity: 0.6; transform: translate(-50%, -50%) scale(1.2); }
    }

    @keyframes enter {
      from { opacity: 0; transform: translateY(-10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (min-width: 480px) {
      .btn { width: auto; min-width: 300px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before { animation: none !important; transition: none !important; }
    }
  </style>
</head>

<body>
  <main>
    <h1>Compra confirmada com sucesso! 🎉</h1>
    <p>Seu conteúdo está disponível abaixo. Toque no botão para acessar.</p>
    <a class="btn"
       href="https://drive.google.com/drive/folders/1X7XUHGej448reRy7zYBsMGR7zsiBxaKJ?usp=drive_link"
       target="_blank"
       rel="noopener noreferrer">ACESSAR MEU CONTEÚDO</a>
  </main>
</body>
</html>
